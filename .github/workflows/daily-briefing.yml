name: Daily Life OS Morning Briefing

on:
  schedule:
    # 02:30 UTC is 08:00 AM IST (Indian Standard Time)
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  dispatch_briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Daily Briefing Dispatcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 scripts/daily_briefing.py
